name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Site configuration lives here, in one place, for BOTH hosts.
# Contact details are repository variables, not committed to the repo
# (.env.local is git-ignored). An unset variable simply means the site hides
# that channel — nothing is ever invented.
#
# VITE_SITE_URL is deliberately the GitHub Pages URL even for the Cloudflare
# build: Pages is canonical, so the mirror points back at it instead of
# competing as duplicate content.
env:
  # Declared at workflow level so the "is Cloudflare configured?" step guard
  # can read it — a step cannot test an env var it defines itself.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
  VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
  VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
  VITE_CONTACT_PHONE: ${{ vars.VITE_CONTACT_PHONE }}
  VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
  VITE_FORM_ACCESS_KEY: ${{ vars.VITE_FORM_ACCESS_KEY }}
  VITE_COMPANY_NAME: ${{ vars.VITE_COMPANY_NAME }}
  VITE_COMPANY_NAME_ZH: ${{ vars.VITE_COMPANY_NAME_ZH }}
  VITE_COMPANY_REGISTRATION_NO: ${{ vars.VITE_COMPANY_REGISTRATION_NO }}
  VITE_OFFICE_ADDRESS_STREET: ${{ vars.VITE_OFFICE_ADDRESS_STREET }}
  VITE_OFFICE_ADDRESS_LOCALITY: ${{ vars.VITE_OFFICE_ADDRESS_LOCALITY }}
  VITE_OFFICE_ADDRESS_POSTAL_CODE: ${{ vars.VITE_OFFICE_ADDRESS_POSTAL_CODE }}
  VITE_SOCIAL_INSTAGRAM: ${{ vars.VITE_SOCIAL_INSTAGRAM }}
  VITE_SOCIAL_FACEBOOK: ${{ vars.VITE_SOCIAL_FACEBOOK }}
  VITE_SOCIAL_YOUTUBE: ${{ vars.VITE_SOCIAL_YOUTUBE }}
  VITE_SOCIAL_LINKEDIN: ${{ vars.VITE_SOCIAL_LINKEDIN }}
  VITE_SOCIAL_TELEGRAM: ${{ vars.VITE_SOCIAL_TELEGRAM }}
  VITE_SOCIAL_XIAOHONGSHU: ${{ vars.VITE_SOCIAL_XIAOHONGSHU }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fail the deploy on a lint or type error rather than shipping it.
      - run: npm run lint
      - run: npm run typecheck
      - run: node serverless/telegram-relay.test.mjs

      # --- Build 1: GitHub Pages -------------------------------------------
      # A project page is served from /<repo>/, so the bundle needs a matching
      # base. github.event.repository.name survives a repo rename.
      - name: Build for GitHub Pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Fail if contact details did not reach the bundle
        run: |
          if [ -n "$VITE_WHATSAPP_NUMBER" ] && ! grep -rq "$VITE_WHATSAPP_NUMBER" dist/assets/*.js; then
            echo "::error::VITE_* variables were set but are not present in the build output."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # --- Build 2: Cloudflare mirror --------------------------------------
      # Served from the domain root, so BASE_PATH must NOT be set here.
      # Rebuilt rather than reusing the Pages artifact because the asset base
      # differs between the two hosts.
      - name: Build for Cloudflare
        run: npm run build

      - name: Deploy to Cloudflare
        # Skipped automatically until the API token secret exists, so the
        # Pages deploy never fails just because Cloudflare is not set up yet.
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
