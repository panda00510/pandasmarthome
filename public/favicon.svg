<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <title>Panda Smart Home</title>
  <!--
    Brand favicon. Geometry must stay in sync with
    src/components/brand/PandaMark.tsx and public/og-image.svg.

    The plate stays light in both colour schemes on purpose: a panda is dark
    markings on a light face, so inverting for dark mode would render a
    photo-negative panda, which reads as some other animal entirely.
  -->
  <rect width="40" height="40" rx="9" fill="#fbfbf9" />
  <mask id="pandaEyes" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40">
    <rect width="40" height="40" fill="#fff" />
    <circle cx="14.7" cy="20.4" r="1.15" fill="#000" />
    <circle cx="25.3" cy="20.4" r="1.15" fill="#000" />
  </mask>
  <g mask="url(#pandaEyes)" fill="#0c0f13"
     transform="translate(20 21.4) scale(0.88) translate(-20 -21.4)">
    <circle cx="10.6" cy="10.4" r="5.2" />
    <circle cx="29.4" cy="10.4" r="5.2" />
    <circle cx="20" cy="21.9" r="13.1" fill="none" stroke="#0c0f13" stroke-width="2.3" />
    <ellipse cx="14.1" cy="20.1" rx="3.3" ry="4.3" transform="rotate(-30 14.1 20.1)" />
    <ellipse cx="25.9" cy="20.1" rx="3.3" ry="4.3" transform="rotate(30 25.9 20.1)" />
    <path d="M18.35 25.4 Q20 24.75 21.65 25.4 Q20 27.9 18.35 25.4 Z" />
  </g>
</svg>
