<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <title>Panda Smart Home</title>
  <!--
    Brand favicon. Geometry must stay in sync with
    src/components/brand/PandaMark.tsx and public/og-image.svg.

    The plate stays light in both colour schemes on purpose: a panda is dark
    markings on a light face, so inverting for dark mode would render a
    photo-negative that reads as some other animal.
  -->
  <rect width="40" height="40" rx="9" fill="#fbfbf9" />
  <mask id="pandaCut" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40">
    <rect width="40" height="40" fill="#fff" />
    <circle cx="14.7" cy="22.3" r="2.6" fill="#000" />
    <circle cx="25.3" cy="22.3" r="2.6" fill="#000" />
    <ellipse cx="20" cy="28.5" rx="1.7" ry="0.75" fill="#000" />
  </mask>
  <g transform="translate(20 22) scale(0.87) translate(-20 -22)">
    <g mask="url(#pandaCut)" fill="#0c0f13">
      <ellipse cx="9.2" cy="10.2" rx="5.5" ry="6.1" transform="rotate(-22 9.2 10.2)" />
      <ellipse cx="30.8" cy="10.2" rx="5.5" ry="6.1" transform="rotate(22 30.8 10.2)" />
      <ellipse cx="20" cy="22.6" rx="14" ry="12.9" fill="none" stroke="#0c0f13" stroke-width="2.4" />
      <ellipse cx="13.4" cy="21.2" rx="5.1" ry="6.3" transform="rotate(-16 13.4 21.2)" />
      <ellipse cx="26.6" cy="21.2" rx="5.1" ry="6.3" transform="rotate(16 26.6 21.2)" />
      <ellipse cx="20" cy="28.5" rx="2.9" ry="1.6" fill="none" stroke="#0c0f13" stroke-width="1.35" />
      <rect x="19.32" y="29.5" width="1.36" height="3.3" rx="0.6" />
      <rect x="16.85" y="32.2" width="6.3" height="1.35" rx="0.65" />
    </g>
    <g fill="#0c0f13">
      <circle cx="15.3" cy="22.9" r="1.15" />
      <circle cx="24.7" cy="22.9" r="1.15" />
    </g>
  </g>
</svg>
