<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Panda Smart Home — Open Smart Home Solutions Singapore</title>
  <!--
    Source for the social share card. Rasterised to og-image.png by `npm run og`.
    Uses a system font stack so it renders identically without webfont loading.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b21" />
      <stop offset="1" stop-color="#0c0f13" />
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.72">
      <stop offset="0" stop-color="#1f8a5f" stop-opacity="0.34" />
      <stop offset="1" stop-color="#1f8a5f" stop-opacity="0" />
    </radialGradient>
    <mask id="eyes" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40">
      <rect width="40" height="40" fill="#fff" />
      <circle cx="14.7" cy="20.4" r="1.15" fill="#000" />
      <circle cx="25.3" cy="20.4" r="1.15" fill="#000" />
    </mask>
  </defs>

  <rect width="1200" height="630" fill="url(#plate)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Brand lockup -->
  <g transform="translate(88 84)">
    <!-- Light badge: the panda keeps its natural black-on-white markings even
         on the dark card. Inverting would produce a negative panda. -->
    <rect x="-4" y="-4" width="68" height="68" rx="16" fill="#fbfbf9" />
    <g transform="translate(30 26) scale(1.32) translate(-20 -21.4)" mask="url(#eyes)" fill="#0c0f13">
      <circle cx="10.6" cy="10.4" r="5.2" />
      <circle cx="29.4" cy="10.4" r="5.2" />
      <circle cx="20" cy="21.9" r="13.1" fill="none" stroke="#0c0f13" stroke-width="2.3" />
      <ellipse cx="14.1" cy="20.1" rx="3.3" ry="4.3" transform="rotate(-30 14.1 20.1)" />
      <ellipse cx="25.9" cy="20.1" rx="3.3" ry="4.3" transform="rotate(30 25.9 20.1)" />
      <path d="M18.35 25.4 Q20 24.75 21.65 25.4 Q20 27.9 18.35 25.4 Z" />
    </g>
    <text x="86" y="36" fill="#fbfbf9" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="27" font-weight="600" letter-spacing="-0.3">Panda Smart Home</text>
  </g>

  <!-- Headline -->
  <text x="88" y="286" fill="#fbfbf9" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="74" font-weight="700" letter-spacing="-2.4">A home that answers to you,</text>
  <text x="88" y="372" fill="#6fc79f" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="74" font-weight="700" letter-spacing="-2.4">not to the cloud.</text>

  <text x="88" y="430" fill="#b2b9c3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="27" font-weight="400">Open smart home design and installation for Singapore homes.</text>

  <!-- Accent rule -->
  <rect x="88" y="482" width="132" height="4" rx="2" fill="#1f8a5f" />

  <!-- Chips -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500" fill="#d6dae0">
    <text x="88" y="546">Home Assistant</text>
    <text x="308" y="546" fill="#667080">·</text>
    <text x="336" y="546">Matter</text>
    <text x="440" y="546" fill="#667080">·</text>
    <text x="468" y="546">Thread</text>
    <text x="574" y="546" fill="#667080">·</text>
    <text x="602" y="546">Zigbee</text>
    <text x="704" y="546" fill="#667080">·</text>
    <text x="732" y="546">Z-Wave</text>
  </g>

  <text x="1112" y="546" text-anchor="end" fill="#87909e"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500">Singapore</text>
</svg>
